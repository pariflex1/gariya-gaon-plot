<style>

/* =========================================
   BASIC RESET
========================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: #ffffff;
}

body {
    overflow-x: hidden;
}


/* =========================================
   HIDE SCROLLBAR
========================================= */

::-webkit-scrollbar {
    display: none;
}

html {
    scrollbar-width: none;
}


/* =========================================
   NORMAL PAGE IMAGES
========================================= */

.page-image {
    display: block;

    width: 100%;
    max-width: 100%;

    height: auto;

    margin: 0;
    padding: 0;
}


/* =========================================
   CLICKABLE IMAGES
========================================= */

.image-link {
    display: block;

    width: 100%;

    margin: 0;
    padding: 0;

    line-height: 0;

    text-decoration: none;
}

.image-link img {
    display: block;

    width: 100%;
    max-width: 100%;

    height: auto;

    margin: 0;
    padding: 0;
}


/* =========================================
   MANUAL TOUCH SLIDER
========================================= */

.slider {

    width: 100%;

    overflow: hidden;

    margin: 12px 0 12px;

    padding: 0;

    /*
       Allow normal vertical page scrolling
       while horizontal swipe works inside
       the slider.
    */
    touch-action: pan-y;

    cursor: grab;

    user-select: none;
    -webkit-user-select: none;

    -webkit-tap-highlight-color: transparent;
}


.slider:active {
    cursor: grabbing;
}


/* =========================================
   SLIDER TRACK
========================================= */

.track {

    display: flex;

    width: max-content;

    margin: 0;
    padding: 0;

    transform: translate3d(0, 0, 0);

    will-change: transform;
}


/* =========================================
   SLIDE
========================================= */

.slide {

    flex: 0 0 88vw;

    width: 88vw;

    margin-right: 8px;

    padding: 0;
}


/* =========================================
   SLIDER IMAGE
========================================= */

.slide img {

    display: block;

    width: 100%;

    height: auto;

    aspect-ratio: 1 / 1;

    object-fit: cover;

    margin: 0;
    padding: 0;

    /*
       Prevent normal browser image dragging.
    */
    pointer-events: none;

    -webkit-user-drag: none;
}


/* =========================================
   MOBILE
========================================= */

@media screen and (max-width: 500px) {

    .slider {
        margin-top: 10px;
        margin-bottom: 10px;
    }

    .slide {

        flex: 0 0 88vw;

        width: 88vw;

        margin-right: 8px;

    }

}


/* =========================================
   DESKTOP
========================================= */

@media screen and (min-width: 501px) {

    .slide {

        flex: 0 0 420px;

        width: 420px;

        margin-right: 12px;

    }

}

</style>

<script>

/* =========================================
   MANUAL TOUCH / MOUSE SLIDER
========================================= */

(function () {

    const slider =
        document.getElementById("slider");

    const track =
        document.getElementById("track");


    if (!slider || !track) {
        return;
    }


    /* -----------------------------------------
       VARIABLES
    ----------------------------------------- */

    let currentX = 0;

    let startX = 0;

    let startPosition = 0;

    let isDragging = false;

    let maxScroll = 0;


    /* -----------------------------------------
       CALCULATE SLIDER WIDTH
    ----------------------------------------- */

    function calculateWidth() {

        maxScroll =
            track.scrollWidth -
            slider.clientWidth;


        if (maxScroll < 0) {
            maxScroll = 0;
        }


        /*
         * Keep slider inside boundaries
         */

        currentX =
            Math.max(
                -maxScroll,
                Math.min(
                    0,
                    currentX
                )
            );


        updateSlider();

    }


    /* -----------------------------------------
       UPDATE POSITION
    ----------------------------------------- */

    function updateSlider() {

        track.style.transform =
            "translate3d(" +
            currentX +
            "px, 0, 0)";

    }


    /* -----------------------------------------
       POINTER DOWN
    ----------------------------------------- */

    slider.addEventListener(
        "pointerdown",
        function (event) {

            isDragging = true;

            startX =
                event.clientX;

            startPosition =
                currentX;


            try {

                slider.setPointerCapture(
                    event.pointerId
                );

            } catch (error) {}

        }
    );


    /* -----------------------------------------
       POINTER MOVE
    ----------------------------------------- */

    slider.addEventListener(
        "pointermove",
        function (event) {

            if (!isDragging) {
                return;
            }


            const distance =
                event.clientX -
                startX;


            let newPosition =
                startPosition +
                distance;


            /*
             * Don't move beyond
             * the first slide.
             */

            newPosition =
                Math.min(
                    0,
                    newPosition
                );


            /*
             * Don't move beyond
             * the last slide.
             */

            newPosition =
                Math.max(
                    -maxScroll,
                    newPosition
                );


            currentX =
                newPosition;


            updateSlider();

        }
    );


    /* -----------------------------------------
       STOP DRAGGING
    ----------------------------------------- */

    function stopDragging(event) {

        if (!isDragging) {
            return;
        }


        isDragging = false;


        try {

            slider.releasePointerCapture(
                event.pointerId
            );

        } catch (error) {}

    }


    slider.addEventListener(
        "pointerup",
        stopDragging
    );


    slider.addEventListener(
        "pointercancel",
        stopDragging
    );


    /* -----------------------------------------
       RESIZE
    ----------------------------------------- */

    window.addEventListener(
        "resize",
        calculateWidth
    );


    /* -----------------------------------------
       INITIALIZE
    ----------------------------------------- */

    calculateWidth();


})();

</script>
