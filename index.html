<style>

* {

}

html,
body {
    margin: 0;
    padding: 0;
    background: #ffffff;
}

body {
    overflow-x: hidden;
}

/* Hide scrollbar */

    display: none;
}

/* Normal images */

    display: block;
    width: 100%;
    max-width: 100%;
    height: auto;
    margin: 0 auto;
}

/* Clickable images */
a {
    display: block;
    margin: 0;
    padding: 0;
    line-height: 0;
    text-decoration: none;
}

a img {
    display: block;
    width: 100%;
    max-width: 100%;
    height: auto;
    margin: 0;
}

/* =========================
   HORIZONTAL SCROLL SLIDER
========================= */

.slider {
    width: 100%;
    overflow: hidden;
    margin: 15px 0 0;
    padding: 0;

    touch-action: pan-y;
    cursor: grab;

    user-select: none;
    -webkit-user-select: none;

    -webkit-overflow-scrolling: touch;
}

.slider:active {
    cursor: grabbing;
}

.track {
    display: flex;
    width: max-content;
    will-change: transform;
}

.slide {
    flex: 0 0 90vw;
    width: 90vw;
    margin-right: 10px;
}

.slide img {
    display: block;

    width: 100%;
    height: auto;

    aspect-ratio: 1 / 1;
    object-fit: cover;

    margin: 0;
    padding: 0;

    pointer-events: none;
    -webkit-user-drag: none;
}

/* Mobile */
@media screen and (max-width: 500px) {

    .slider {
        margin-top: 10px;
    }

    .slide {
        flex: 0 0 88vw;
        width: 88vw;
        margin-right: 8px;
    }

}

/* Desktop */
@media screen and (min-width: 501px) {

    .slide {
        flex: 0 0 420px;
        width: 420px;
    }

}

</style>

<script>

(function () {

    const slider = document.getElementById("slider");
    const track = document.getElementById("track");

    if (!slider || !track) {
        return;
    }

    /*
     * Clone all slides.
     * This creates a seamless infinite slider.
     */

    const originalSlides = Array.from(track.children);

    originalSlides.forEach(function (slide) {
        track.appendChild(slide.cloneNode(true));
    });


    let position = 0;

    /*
     * Scroll speed.
     * Lower = slower
     * Higher = faster
     */

    const speed = 0.7;

    let halfWidth = 0;

    let dragging = false;

    let startX = 0;

    let startPosition = 0;


    /*
     * Calculate the width of the
     * original set of slides.
     */

    function measure() {

        halfWidth = track.scrollWidth / 2;

    }


    /*
     * Keep position inside the
     * first set of slides.
     */

    function normalize(value) {

        if (halfWidth <= 0) {
            return 0;
        }

        value = value % halfWidth;

        if (value < 0) {
            value += halfWidth;
        }

        return value;

    }


    /*
     * Move slider.
     */

    function setPosition(value) {

        position = normalize(value);

        track.style.transform =
            "translate3d(" +
            (-position) +
            "px, 0, 0)";

    }


    /*
     * Resize handling.
     */

    window.addEventListener(
        "resize",
        measure
    );


    measure();


    /*
     * Touch / Mouse drag
     */

    slider.addEventListener(
        "pointerdown",
        function (event) {

            dragging = true;

            startX = event.clientX;

            startPosition = position;

            slider.setPointerCapture(
                event.pointerId
            );

        }
    );


    slider.addEventListener(
        "pointermove",
        function (event) {

            if (!dragging) {
                return;
            }

            const distance =
                event.clientX - startX;

            setPosition(
                startPosition - distance
            );

        }
    );


    function stopDragging(event) {

        dragging = false;

        try {

            slider.releasePointerCapture(
                event.pointerId
            );

        } catch (error) {}

    }


    slider.addEventListener(
        "pointerup",
        stopDragging
    );

    slider.addEventListener(
        "pointercancel",
        stopDragging
    );

    slider.addEventListener(
        "pointerleave",
        function () {

            /*
             * Don't stop dragging on mobile.
             * Pointer capture handles this.
             */

        }
    );


    /*
     * Automatic continuous scrolling.
     */

    function animate() {

        if (!dragging) {

            setPosition(
                position + speed
            );

        }

        requestAnimationFrame(
            animate
        );

    }


    requestAnimationFrame(
        animate
    );

})();

</script>
